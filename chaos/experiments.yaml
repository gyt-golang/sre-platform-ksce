# 混沌工程实验集 —— Chaos Mesh CRD
# 前置：helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --create-namespace
#       --set chaosDaemon.runtime=containerd --set controllerManager.replicaCount=1
#
# 实验设计原则：每个实验对应一个 SRE 可靠性假设，验证系统在故障下仍满足 SLO。
# 三类故障覆盖：进程级（Pod Kill）、网络级（延迟/丢包）、资源级（CPU 压力）。
---
# 实验 1：Pod Kill —— 验证 K8s 自愈（Deployment 自动重建 + readiness 流量摘除）
# 假设：随机杀掉 1 个 ordersvc Pod，服务可用性 SLI 在 30s 内恢复，SLO 不被击穿。
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: ordersvc-pod-kill
  namespace: sre-demo
  labels:
    chaos-mesh.org/experiment: pod-kill
spec:
  action: pod-kill
  mode: one              # 每次杀 1 个 Pod（3 副本，保留多数）
  selector:
    namespaces: [sre-demo]
    labelSelectors:
      app: ordersvc
  # 一次性实验：apply 即杀 1 个 Pod，验证 Deployment 自愈 + readiness 流量摘除。
  # Chaos Mesh 2.7 起周期调度改用独立 Schedule CRD，单 Chaos 资源做一次性实验。
  duration: "0s"
---
# 实验 2：网络延迟 —— 验证延迟 SLO 告警与 HPA 容量弹性
# 假设：注入 200ms 网络延迟，P99 延迟告警触发，但服务仍可用（错误率不升）。
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: ordersvc-net-delay
  namespace: sre-demo
  labels:
    chaos-mesh.org/experiment: net-delay
spec:
  action: delay
  mode: all
  selector:
    namespaces: [sre-demo]
    labelSelectors:
      app: ordersvc
  delay:
    latency: "200ms"
    jitter: "50ms"
  direction: to
  duration: "60s"
  # 一次性实验：apply 即注入 60s 网络延迟，到期自动恢复。
---
# 实验 3：CPU 压力 —— 验证 HPA 基于 CPU 利用率自动扩容
# 假设：注入 80% CPU 负载，HPA 在 30s 内触发扩容，副本数 3→N，CPU 利用率回落。
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: ordersvc-cpu-stress
  namespace: sre-demo
  labels:
    chaos-mesh.org/experiment: cpu-stress
spec:
  mode: all
  selector:
    namespaces: [sre-demo]
    labelSelectors:
      app: ordersvc
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "90s"
  # 一次性实验：apply 即注入 90s CPU 压力，到期自动恢复。
---
# 实验 4：HTTP 故障注入（应用层）—— 通过 /admin/fault 注入 50% 5xx
# 注意：此实验不用 Chaos Mesh，而是用 Service 调用 ordersvc 的 /admin/fault 接口
# 直接热更新应用故障率，验证错误预算燃烧速率告警（OrdersvcHighErrorRatePage）。
# 见 scripts/chaos-inject-fault.sh
#
# 进化功能：稳态校验见 steady-state.yaml —— Chaos Mesh 实验 + Argo AnalysisRun
# 自动校验 SLO 稳态假设（burn_rate5m ≤ 1），实验击穿 SLO 自动标记失败。
