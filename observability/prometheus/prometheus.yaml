# 可观测性 —— Metrics 支柱：Prometheus
# 通过 kubernetes_sd_configs + Pod 注解自动发现 ordersvc:9090/metrics，
# 加载 SLO 录制规则与告警规则（ConfigMap 挂载）。
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observability
---
# RBAC：最小权限，仅允许 Prometheus list/watch Pod/Service/Endpoint 做 SD。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes, namespaces, nodes/proxy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observability
---
# Prometheus 规则（SLO 录制规则 + 告警规则），通过 prometheus.yml rule_files 加载。
# 实现 Google SRE 多窗口多燃烧率告警：5m/30m/1h/6h/1d 五窗口，Page/Ticket/Budget 三档。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: observability
data:
  slo.yml: |
    groups:
      - name: ordersvc.sli.recording
        interval: 30s
        rules:
          # 请求总量速率（QPS），按 path 维度 —— 5 个窗口
          - record: ordersvc:request_rate5m
            expr: sum by (path) (rate(ordersvc_http_requests_total[5m]))
          - record: ordersvc:request_rate30m
            expr: sum by (path) (rate(ordersvc_http_requests_total[30m]))
          - record: ordersvc:request_rate1h
            expr: sum by (path) (rate(ordersvc_http_requests_total[1h]))
          - record: ordersvc:request_rate6h
            expr: sum by (path) (rate(ordersvc_http_requests_total[6h]))
          - record: ordersvc:request_rate1d
            expr: sum by (path) (rate(ordersvc_http_requests_total[1d]))
          # 错误请求速率（5xx）—— 5 个窗口
          - record: ordersvc:error_rate5m
            expr: sum by (path) (rate(ordersvc_http_requests_total{code=~"5.."}[5m]))
          - record: ordersvc:error_rate30m
            expr: sum by (path) (rate(ordersvc_http_requests_total{code=~"5.."}[30m]))
          - record: ordersvc:error_rate1h
            expr: sum by (path) (rate(ordersvc_http_requests_total{code=~"5.."}[1h]))
          - record: ordersvc:error_rate6h
            expr: sum by (path) (rate(ordersvc_http_requests_total{code=~"5.."}[6h]))
          - record: ordersvc:error_rate1d
            expr: sum by (path) (rate(ordersvc_http_requests_total{code=~"5.."}[1d]))
          # 错误比率 = error_rate / request_rate —— 5 个窗口
          - record: ordersvc:error_ratio5m
            expr: ordersvc:error_rate5m / ordersvc:request_rate5m
          - record: ordersvc:error_ratio30m
            expr: ordersvc:error_rate30m / ordersvc:request_rate30m
          - record: ordersvc:error_ratio1h
            expr: ordersvc:error_rate1h / ordersvc:request_rate1h
          - record: ordersvc:error_ratio6h
            expr: ordersvc:error_rate6h / ordersvc:request_rate6h
          - record: ordersvc:error_ratio1d
            expr: ordersvc:error_rate1d / ordersvc:request_rate1d
          # 燃烧率 = 错误率 / 允许错误率(0.001)，=1 匀速消耗，=14.4 表示 1h 耗 2% 月预算
          - record: ordersvc:burn_rate5m
            expr: ordersvc:error_ratio5m / 0.001
          - record: ordersvc:burn_rate30m
            expr: ordersvc:error_ratio30m / 0.001
          - record: ordersvc:burn_rate1h
            expr: ordersvc:error_ratio1h / 0.001
          - record: ordersvc:burn_rate6h
            expr: ordersvc:error_ratio6h / 0.001
          - record: ordersvc:burn_rate1d
            expr: ordersvc:error_ratio1d / 0.001
          # 延迟 SLI：P99（histogram_quantile）
          - record: ordersvc:latency_p99_5m
            expr: |
              histogram_quantile(0.99,
                sum by (path, le) (rate(ordersvc_http_request_duration_seconds_bucket[5m])))
      - name: ordersvc.slo.alerts
        interval: 30s
        rules:
          # 页面告警（Page）：5m & 1h 双窗口，燃烧率 > 14.4。1h 内消耗 ≥2% 月预算 → 立即介入。
          - alert: OrdersvcHighErrorRatePage
            expr: |
              ordersvc:burn_rate5m > 14.4
              and ordersvc:burn_rate1h > 14.4
            for: 2m
            labels: {severity: page, slo: availability-99.9, team: sre}
            annotations:
              runbook_url: "https://raw.githubusercontent.com/gyt-golang/sre-platform-ksce/main/docs/runbook/ordersvc-high-error-rate.md"
              dashboard_url: "http://10.0.0.182:30300/d/ordersvc-sre-slo/ordersvc-sre-slo"
              summary: "ordersvc 可用性急剧恶化，错误预算高速燃烧"
              description: "5m 与 1h 窗口燃烧率均超 14.4，1 小时内已消耗 ≥2% 月错误预算。"
              runbook: "docs/runbook/ordersvc-high-error-rate.md"
          # 工单告警（Ticket）：30m & 6h 双窗口，燃烧率 > 6。6h 消耗 ~5% 月预算 → 建工单。
          - alert: OrdersvcHighErrorRateTicket
            expr: |
              ordersvc:burn_rate30m > 6
              and ordersvc:burn_rate6h > 6
            for: 15m
            labels: {severity: ticket, slo: availability-99.9, team: sre}
            annotations:
              runbook_url: "https://raw.githubusercontent.com/gyt-golang/sre-platform-ksce/main/docs/runbook/ordersvc-high-error-rate.md"
              dashboard_url: "http://10.0.0.182:30300/d/ordersvc-sre-slo/ordersvc-sre-slo"
              summary: "ordersvc 错误率持续偏高，预算稳步消耗"
              description: "30m 与 6h 窗口燃烧率均超 6，6 小时内消耗约 5% 月错误预算。"
          # 预算预警（Budget）：1d 窗口，燃烧率 > 1。按当前速率 30 天将耗尽预算 → 排期优化。
          - alert: OrdersvcErrorBudgetExhausting
            expr: ordersvc:burn_rate1d > 1
            for: 1h
            labels: {severity: ticket, slo: availability-99.9, team: sre}
            annotations:
              runbook_url: "https://raw.githubusercontent.com/gyt-golang/sre-platform-ksce/main/docs/runbook/ordersvc-high-error-rate.md"
              dashboard_url: "http://10.0.0.182:30300/d/ordersvc-sre-slo/ordersvc-sre-slo"
              summary: "ordersvc 错误预算按当前速率将在 30 天内耗尽"
              description: "1d 窗口燃烧率 > 1，需排期优化，避免预算提前耗尽。"
          # 延迟告警：P99 > 500ms SLO
          - alert: OrdersvcHighLatencyP99
            expr: ordersvc:latency_p99_5m > 0.5
            for: 5m
            labels: {severity: ticket, slo: latency-500ms, team: sre}
            annotations:
              runbook_url: "https://raw.githubusercontent.com/gyt-golang/sre-platform-ksce/main/docs/runbook/ordersvc-high-error-rate.md"
              dashboard_url: "http://10.0.0.182:30300/d/ordersvc-sre-slo/ordersvc-sre-slo"
              summary: "ordersvc P99 延迟超 500ms SLO"
          # 混沌演练标记
          - alert: OrdersvcChaosInjected
            expr: ordersvc_failure_rate_injected > 0
            for: 1m
            labels: {severity: info, chaos: "true"}
            annotations:
              summary: "混沌演练中，故障已注入"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels: {cluster: ksce, monitor: sre-demo}
    rule_files:
      - /etc/prometheus/rules/slo.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      # 自动发现带 prometheus.io/scrape 注解的 Pod（ordersvc 即此方式）
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
      # Prometheus 自身
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle
          ports:
            - {name: web, containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: rules, mountPath: /etc/prometheus/rules}
            - {name: data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: web}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /-/healthy, port: web}
            initialDelaySeconds: 15
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: rules
          configMap: {name: prometheus-rules}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: web, nodePort: 30090}]
