# 可观测性 —— Logs 支柱：Loki + Promtail
# Promtail 以 DaemonSet 采集每个节点容器日志（含 ordersvc 结构化 JSON 日志），
# 打上 namespace/pod/container 标签后发送至 Loki，Grafana 可按 Label 过滤检索。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector: {matchLabels: {app: loki}}
  template:
    metadata: {labels: {app: loki}}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args: ["-config.file=/etc/loki/loki.yml"]
          ports: [{containerPort: 3100, name: http}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
      volumes:
        - name: config
          configMap: {name: loki-config}
        # 本地仅存 wal/cache；chunks + tsdb 索引均落金山云 KS3（object_store: s3）实现存算分离。
        # emptyDir 而非 PVC：集群 local-path provisioner 动态建 PV 超时（ProvisioningFailed 120s），
        # 且 tsdb 索引已上传对象存储，本地无需持久化，Pod 重启后从 KS3 重建。
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        # 金山云 KS3（S3 兼容）：chunks + tsdb 索引落对象存储，实现日志存算分离与长期归档。
        # AK/SK 占位符，bootstrap-ksce.sh apply 前从 KS3_AK/KS3_SK 环境变量 sed 注入，不入库。
        # 字段名遵循 Loki 3.x Thanos Object Storage Client：bucketnames / s3forcepathstyle（非老式 bucket_name）。
        s3:
          endpoint: ks3-cn-beijing.ksyuncs.com
          bucketnames: gyt-test
          access_key_id: __KS3_AK__
          secret_access_key: __KS3_SK__
          region: cn-beijing
          s3forcepathstyle: false
      replication_factor: 1
      ring:
        kvstore: {store: inmemory}
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index: {prefix: index_, period: 24h}
    limits_config:
      # 单租户简化配置，适配 demo 与中小规模日志量。
      retention_period: 168h
      max_query_series: 1000
    ingester:
      # demo 加速：缩短 chunk flush 周期，让 chunks 更快落 KS3（生产应保持默认 30m/2h）。
      chunk_idle_period: 1m
      max_chunk_age: 1m
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector: {app: loki}
  ports: [{port: 3100, targetPort: http}]
---
# Promtail RBAC：kubernetes_sd 发现 pod 需 list/watch pods/nodes/namespaces 权限。
# 缺失则 Promtail 用 default SA 报 "pods is forbidden"，发现不到 Pod 不采集日志。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "namespaces", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: observability
---
# Promtail DaemonSet：采集 /var/log/pods/*.log，自动注入 K8s 元数据标签。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: observability
spec:
  selector: {matchLabels: {app: promtail}}
  template:
    metadata: {labels: {app: promtail}}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.2.0
          args: ["-config.file=/etc/promtail/promtail.yml"]
          env:
            - {name: HOSTNAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: logs, mountPath: /var/log}
            - {name: pos, mountPath: /run/promtail}
          resources:
            requests: {cpu: 30m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        - name: logs
          hostPath: {path: /var/log}
        - name: pos
          hostPath: {path: /run/promtail}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # 关键：关联 Pod 日志文件路径，否则 Promtail 报 "no path for target" 不采集
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_uid]
            separator: "_"
            target_label: __path__
            replacement: /var/log/pods/$1/*/*.log
            regex: (.+)
        pipeline_stages:
          # 解析 ordersvc 输出的结构化日志，提取 level 字段便于按日志级别过滤。
          - json:
              expressions:
                level: level
                msg: msg
          - labels:
              level:
